<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .4s}
body.login{--bg:#1b1035;--ink:#fff;--a:#ff6b4a;--b:#ffb627;--c:#7c4dff;--card:#2a1b4d;--mut:#b9aee0}
body.student{--bg:#fff6ec;--ink:#2a1a3d;--a:#ff6b4a;--b:#ffb627;--c:#7c4dff;--card:#fff;--mut:#7d6f90;--line:#f0e2d2}
body.faculty{--bg:#0d1130;--ink:#eef0ff;--a:#2ee6c5;--b:#6c7bff;--c:#ff7ad9;--card:#171c47;--mut:#98a0d6;--line:#262c66}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0 0 .4em;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:.6em 1em;background:linear-gradient(120deg,var(--a),var(--b));color:#1b1035;font-weight:600;transition:transform .15s}
button:active{transform:scale(.95)}button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
button.ok{background:#2ecc71}button.no{background:#ff5470;color:#fff}
input,select,textarea{width:100%;padding:.65em .8em;border-radius:12px;border:1.5px solid var(--line,#5a4a8a);background:transparent;margin:.25em 0 .7em}
option{color:#000}:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
nav .logo{font:800 22px 'Bricolage Grotesque';margin-bottom:14px;background:linear-gradient(120deg,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{background:transparent;color:var(--mut);text-align:left;display:flex;gap:10px;align-items:center}
nav button.on{background:var(--card);color:var(--ink);box-shadow:inset 4px 0 0 var(--a)}
main{padding:20px 26px 90px;max-width:980px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative}
.hero{border-radius:26px;padding:24px;background:linear-gradient(130deg,var(--a),var(--c));color:#fff;margin-bottom:18px}
.hero h1{font-size:30px;margin:0}.hero p{margin:4px 0 0;opacity:.9}
body.faculty .hero{background:linear-gradient(130deg,#2b3aa8,#6c1fa8);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line,transparent);margin-bottom:12px;transition:transform .2s,box-shadow .2s}
.card.click{cursor:pointer}.card.click:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}
.card.unread{border-left:5px solid var(--a)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--ink);margin-right:6px}
.chip.g{background:#2ecc7133;color:#1fa65a}.chip.r{background:#ff547033;color:#ff5470}.chip.y{background:#ffb62733;color:#d98e00}.chip.v{background:#7c4dff33;color:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{padding:.35em .9em;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.chips button.on{background:var(--ink);color:var(--bg)}
.mut{color:var(--mut);font-size:13px}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.tl .it{position:relative}.tl .it:before{content:"";position:absolute;left:-22px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--b)}
.tl .it.now:before{background:var(--a);border-color:var(--a);box-shadow:0 0 0 6px #ff6b4a33;animation:pulse 1.6s infinite}
body.faculty .tl .it.now:before{box-shadow:0 0 0 6px #2ee6c533}
@keyframes pulse{50%{box-shadow:0 0 0 10px transparent}}
.rings{display:flex;gap:18px;flex-wrap:wrap}
.ring{--p:70;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.ring *{position:relative}.ring b{font:800 22px 'Bricolage Grotesque';display:block;line-height:1}.ring small{color:var(--mut);font-size:11px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width .8s}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--a);display:inline-block}
#sr{position:absolute;top:100%;left:0;right:0;z-index:20}
.veil{position:fixed;inset:0;background:#0007;z-index:50;display:none}.veil.show{display:block}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:51;padding:22px;overflow:auto;transform:translateX(105%);transition:transform .3s}
#dr.show{transform:none}
#toasts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:14px;animation:in .3s;box-shadow:0 8px 20px #0004}
@keyframes in{from{transform:translateY(20px);opacity:0}}
.empty{text-align:center;padding:36px;color:var(--mut)}.empty big{font-size:40px;display:block}
.skel{height:70px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#7c4dff66,transparent 50%),radial-gradient(circle at 80% 80%,#ff6b4a55,transparent 50%)}
.lg .box{background:var(--card);padding:30px;border-radius:26px;width:min(400px,100%)}
.lg h1{font-size:36px}.demo{display:flex;gap:8px;margin:10px 0}.demo button{flex:1;background:#ffffff18;color:#fff;font-size:13px}
@media(max-width:720px){.app{display:block}main{padding:14px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;background:var(--card);z-index:30;padding:6px;justify-content:space-around;border-top:1px solid var(--line)}
nav .logo{display:none}nav button{flex-direction:column;gap:0;font-size:11px;padding:.4em .5em;text-align:center}nav button.on{box-shadow:inset 0 3px 0 var(--a)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="login"><div id="root"></div><div class="veil" id="vl"></div><aside id="dr"></aside><div id="toasts"></div>
<script>
/* ===== CONFIG: paste your Supabase project values to go live (see "Supabase setup" on login) ===== */
const CONFIG={url:'https://nlcbynsolxppaxtlzjbt.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sY2J5bnNvbHhwcGF4dGx6amJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDA4MjUsImV4cCI6MjEwNjk3NjgyNX0.YzjgG-Wx2h_d7UXCfxQkvo7WY8OQzKPVsBQeQX2bEo8'}; let sb=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2600)};
const nowHM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);

/* ===== MOCK DATA (mirrors the SQL tables) ===== */
const D={
 users:{S101:{pw:'demo123',role:'student',name:'Aarav Menon',dept:'CSE',sec:'B',cgpa:8.4,att:86,marks:{DBMS:41,OS:36,Maths:44,Networks:33}},
        F201:{pw:'demo123',role:'faculty',name:'Dr. Meera Iyer',dept:'CSE'}},
 sched:[{id:1,start:'09:00',end:'09:50',subj:'Database Systems',room:'LH-204',fac:'Dr. Meera Iyer',sec:'CSE-B',status:'normal'},
  {id:2,start:'10:00',end:'10:50',subj:'Operating Systems',room:'LH-101',fac:'Prof. R. Kumar',sec:'CSE-B',status:'normal'},
  {id:3,start:'11:15',end:'12:05',subj:'Computer Networks',room:'LH-204',fac:'Dr. Meera Iyer',sec:'CSE-A',status:'normal'},
  {id:4,start:'13:30',end:'16:30',subj:'DBMS Lab',room:'Lab-3',fac:'Dr. Meera Iyer',sec:'CSE-B',status:'normal'}],
 tasks:[{id:1,title:'ER Diagram Assignment',subj:'DBMS',due:'Fri',marks:20,kind:'assignment',fields:['Drive link','Notes'],done:false},
  {id:2,title:'Hackathon Registration Form',subj:'Campus',due:'Mon',marks:0,kind:'form',fields:['Team name','Member count','Idea in one line'],done:false},
  {id:3,title:'OS Lab Record',subj:'OS',due:'Done',marks:10,kind:'assignment',fields:['Drive link'],done:true}],
 bc:[{id:1,from:'Dr. Meera Iyer',scope:'Section CSE-B',title:'DBMS lab shifted to Lab-3',body:'Bring your records. Viva begins this week.',time:'8:10 AM'},
  {id:2,from:'Prof. R. Kumar',scope:'Class CSE Y2',title:'OS quiz on Thursday',body:'Covers scheduling and deadlocks.',time:'Yesterday'}],
 upd:[{id:1,tag:'Exams',title:'Internal assessment 2 timetable released',body:'Starts 20 Oct. Hall tickets at the exam cell.'},
  {id:2,tag:'Events',title:'Tech fest registrations open',body:'Pick up to 3 events. Closes next Friday.'},
  {id:3,tag:'Holiday',title:'Campus closed on Friday',body:'Local festival holiday. Classes resume Monday.'}],
 notes:[{id:1,text:'Assignment "ER Diagram" due Friday',time:'1h'},{id:2,text:'Operating Systems moved to LH-101',time:'3h'}],
 read:new Set(),
 req:[{id:1,from:'Prof. R. Kumar',to:'Dr. Meera Iyer',slot:'Computer Networks, 11:15',reason:'Seminar clash',status:'pending',mine:false}],
 pulse:[{n:'Riya S.',att:62,m:21,cg:6.1},{n:'Karan P.',att:71,m:25,cg:6.9},{n:'Aarav Menon',att:86,m:38.5,cg:8.4},{n:'Nisha T.',att:94,m:44,cg:9.1},{n:'Dev A.',att:58,m:19,cg:5.8}],
 log:['Published DBMS lab update to CSE-B']};

/* ===== SUPABASE LAYER: login + role detection. Data reads/writes follow the same pattern (sb.from('tasks').select()) ===== */
async function initSb(){if(!CONFIG.url||sb)return;await new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js';s.onload=r;document.head.append(s)});sb=supabase.createClient(CONFIG.url,CONFIG.key)}
async function signIn(id,pw){
 await initSb();
 if(sb){const{error}=await sb.auth.signInWithPassword({email:id.toLowerCase()+'@campus.hub',password:pw});if(error)throw error;
  const{data}=await sb.from('users').select('role,name').eq('login_id',id).single();return{id,...data,dept:'CSE',sec:'B',marks:{},cgpa:0,att:0}}
 await new Promise(r=>setTimeout(r,600));
 const u=D.users[id.toUpperCase()];if(!u||u.pw!==pw)throw Error('Wrong ID or password');return{id:id.toUpperCase(),...u}}
async function save(table,row){if(sb)await sb.from(table).insert(row)} // mock mode keeps data in D

/* ===== UI HELPERS ===== */
let me=null,tab='',filt='All',q='';
const ring=(p,l,c)=>`<div class="ring" style="--p:${p}${c?`;--c:${c}`:''}"><div><b>${p}${l.includes('CGPA')?'':'%'}</b><small>${l}</small></div></div>`;
const empty=(i,t)=>`<div class="empty"><big>${i}</big>${t}</div>`;
const open=(html)=>{$('#dr').innerHTML=html+`<button class="ghost" style="margin-top:14px" data-act="close">Close</button>`;$('#dr').classList.add('show');$('#vl').classList.add('show')};
const closeDr=()=>{$('#dr').classList.remove('show');$('#vl').classList.remove('show')};
function field(f){return `<label>${esc(f)}<input name="${esc(f)}" required></label>`}
function sched(list,editable){
 if(!list.length)return empty('🌴','No classes today. Enjoy the free day.');
 const n=nowHM();
 return `<div class="tl">${list.map(s=>{const live=n>=mins(s.start)&&n<mins(s.end);
  return `<div class="card it ${live?'now':''}"><div class="row"><b>${s.start} – ${s.end}</b><span>${live?'<span class="chip g">Live now</span>':''}${s.status!=='normal'?`<span class="chip y">${esc(s.status)}</span>`:''}</span></div>
  <h3 style="margin:2px 0">${esc(s.subj)}</h3><div class="mut">${esc(s.room)} · ${esc(s.sec)} · ${esc(s.fac)}</div></div>`}).join('')}</div>`}

/* ===== LOGIN ===== */
function loginView(){document.body.className='login';
$('#root').innerHTML=`<div class="lg"><form class="box" id="lf"><h1>Campus Hub</h1><p class="mut">Your day, your classes, one place.</p>
<label>Roll No / Faculty ID<input id="lid" autocomplete="username" required placeholder="S101 or F201"></label>
<label>Password<input id="lpw" type="password" autocomplete="current-password" required></label>
<button style="width:100%" id="lb">Sign in</button>
<div class="demo"><button type="button" data-fill="S101">Demo student</button><button type="button" data-fill="F201">Demo faculty</button></div>
<a href="#" data-act="sql" class="mut">Supabase setup (SQL + RLS)</a></form></div>`;
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').textContent='Signing in…';
 try{me=await signIn($('#lid').value.trim(),$('#lpw').value);tab=me.role==='student'?'today':'today';boot()}
 catch(err){toast(err.message);$('#lb').textContent='Sign in'}}}

/* ===== SHELL ===== */
const NAV={student:[['today','🌅','Today'],['inbox','📣','Inbox'],['tasks','✅','Tasks'],['grades','🎯','Grades'],['alerts','🔔','Alerts']],
 faculty:[['today','🧭','Command'],['bcast','📡','Broadcast'],['tasks','📝','Tasks'],['pulse','📈','Pulse'],['swap','🔁','Schedule'],['alerts','🕘','Activity']]};
function boot(){document.body.className=me.role;filt='All';q='';render()}
async function render(){
 const unread=[...D.bc,...D.upd.map(u=>({id:'u'+u.id}))].filter(x=>!D.read.has(x.id)).length;
 $('#root').innerHTML=`<div class="app"><nav><div class="logo">Campus Hub</div>${NAV[me.role].map(([k,i,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${i}<span>${l}${k==='inbox'&&unread?` <span class="dot"></span>`:''}</span></button>`).join('')}<button data-act="out" style="margin-top:auto">🚪<span>Sign out</span></button></nav>
 <main><div class="top"><div class="mut">${esc(me.name)} · ${me.role==='student'?`${me.dept}-${me.sec}`:me.dept+' faculty'}</div>
 ${me.role==='student'?`<input id="q" placeholder="Search tasks, broadcasts, updates…" style="max-width:340px;margin:0" value="${esc(q)}">`:''}<div id="sr"></div></div>
 <div id="view"><div class="skel"></div><div class="skel"></div></div></main></div>`;
 const qi=$('#q');if(qi)qi.oninput=()=>{q=qi.value;showSearch()};
 await new Promise(r=>setTimeout(r,250));
 $('#view').innerHTML=VIEWS[me.role][tab]();}
function showSearch(){const s=q.toLowerCase(),box=$('#sr');if(!s){box.innerHTML='';return}
 const hits=[...D.tasks.map(t=>({k:'task',id:t.id,t:t.title,s:'Task'})),...D.bc.map(b=>({k:'bc',id:b.id,t:b.title,s:'Broadcast'})),...D.upd.map(u=>({k:'upd',id:u.id,t:u.title,s:'Official'}))].filter(x=>x.t.toLowerCase().includes(s));
 box.innerHTML=`<div class="card">${hits.length?hits.map(h=>`<div class="row click" style="cursor:pointer;padding:6px 0" data-hit="${h.k}:${h.id}"><span>${esc(h.t)}</span><span class="chip v">${h.s}</span></div>`).join(''):'<span class="mut">Nothing matches. Try a subject name.</span>'}</div>`}

/* ===== STUDENT VIEWS ===== */
const chipsRow=(opts)=>`<div class="chips">${opts.map(o=>`<button class="${filt===o?'on':''}" data-filt="${o}">${o}</button>`).join('')}</div>`;
const msgCard=(m,type)=>{const id=type==='upd'?'u'+m.id:m.id,un=!D.read.has(id);
 return `<div class="card click ${un?'unread':''}" data-msg="${type}:${m.id}"><div class="row"><span><span class="chip ${type==='upd'?'v':'y'}">${esc(type==='upd'?m.tag:m.scope)}</span>${un?'<span class="chip r">New</span>':''}</span><span class="mut">${esc(m.time||'Official')}</span></div><h3 style="margin:6px 0 2px">${esc(m.title)}</h3><div class="mut">${esc(type==='upd'?'Institution update':'From '+m.from)}</div></div>`};
function taskCard(t){return `<div class="card click" data-task="${t.id}"><div class="row"><span><span class="chip ${t.kind==='form'?'v':'y'}">${t.kind}</span>${t.done?'<span class="chip g">Submitted</span>':`<span class="chip r">Due ${esc(t.due)}</span>`}</span><span class="mut">${t.marks?t.marks+' marks':'No marks'}</span></div><h3 style="margin:6px 0 2px">${esc(t.title)}</h3><div class="mut">${esc(t.subj)}</div></div>`}
const VIEWS={student:{
 today(){const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening',todo=D.tasks.filter(t=>!t.done).length;
  return `<div class="hero"><h1>${g}, ${esc(me.name.split(' ')[0])} 👋</h1><p>${D.sched.length} classes today · ${todo} thing${todo==1?'':'s'} to do · ${D.notes.length} alerts</p></div>
  <div class="grid"><div><h2>Today's schedule</h2>${sched(D.sched.filter(s=>s.sec==='CSE-B'))}</div>
  <div><h2>Up next</h2>${D.tasks.filter(t=>!t.done).map(taskCard).join('')||empty('🎉','All caught up.')}<h2>Official</h2>${D.upd.slice(0,1).map(u=>msgCard(u,'upd')).join('')}</div></div>`},
 inbox(){const all=[...D.bc.map(b=>({...b,t:'bc'})),...D.upd.map(u=>({...u,t:'upd'}))];
  const l=all.filter(m=>filt==='All'||(filt==='Faculty'&&m.t==='bc')||(filt==='Official'&&m.t==='upd')||(filt==='Unread'&&!D.read.has(m.t==='upd'?'u'+m.id:m.id)));
  return `<h1>Inbox</h1>${chipsRow(['All','Faculty','Official','Unread'])}<button class="ghost" data-act="readall" style="margin-bottom:12px">Mark all read</button>${l.map(m=>msgCard(m,m.t)).join('')||empty('📭','Nothing here. Switch filters to see more.')}`},
 tasks(){const l=D.tasks.filter(t=>filt==='All'||(filt==='To do'&&!t.done)||(filt==='Done'&&t.done)||(filt==='Forms'&&t.kind==='form'));
  return `<h1>Tasks and forms</h1>${chipsRow(['All','To do','Done','Forms'])}${l.map(taskCard).join('')||empty('✨','No tasks in this view.')}`},
 grades(){return `<h1>Academic overview</h1><div class="card"><div class="rings">${ring(me.att,'Attendance',me.att<75?'#ff5470':'#2ecc71')}${ring(Math.round(me.cgpa*10),'CGPA '+me.cgpa)}</div></div>
  <h2>Internal marks (out of 50)</h2><div class="card">${Object.entries(me.marks).map(([s,m])=>`<div style="margin-bottom:12px"><div class="row"><b>${s}</b><span>${m}/50</span></div><div class="bar"><i style="width:${m*2}%"></i></div></div>`).join('')}</div>
  ${me.att<85?'<div class="card"><span class="chip y">Heads up</span> Keep attendance above 75% to sit semester exams.</div>':''}`},
 alerts(){return `<h1>Notifications</h1>${D.notes.map(n=>`<div class="card"><div class="row"><span>${esc(n.text)}</span><span class="mut">${n.time}</span></div></div>`).join('')||empty('🔕','No alerts right now.')}${D.notes.length?'<button class="ghost" data-act="clear">Clear all</button>':''}`}},

/* ===== FACULTY VIEWS ===== */
faculty:{
 today(){const mine=D.sched.filter(s=>s.fac===me.name),p=D.pulse.filter(s=>s.att<75).length;
  return `<div class="hero"><h1>Command Center</h1><p>${mine.length} classes today · ${p} students need attention · ${D.req.filter(r=>!r.mine&&r.status==='pending').length} swap request</p></div>
  <div class="row" style="margin-bottom:14px"><button data-tab="bcast">📡 Broadcast</button><button data-tab="tasks">📝 New task</button><button data-tab="swap">🔁 Edit schedule</button></div>
  <h2>Your teaching day</h2>${sched(mine)}`},
 bcast(){return `<h1>Broadcast Studio</h1><form class="card" id="bf"><label>Send to<select id="bs"><option>College</option><option>Department CSE</option><option selected>Section CSE-B</option><option>Class CSE Y2</option></select></label>
  <label>Title<input id="bt" required></label><label>Message<textarea id="bm" rows="3" required></textarea></label><button>Send broadcast</button></form>
  <h2>Sent</h2>${D.bc.map(b=>`<div class="card"><span class="chip v">${esc(b.scope)}</span><h3 style="margin:6px 0 0">${esc(b.title)}</h3><div class="mut">${esc(b.from)} · ${b.time}</div></div>`).join('')}`},
 tasks(){return `<h1>Task Studio</h1><form class="card" id="tf"><label>Title<input id="tt" required></label><div class="row"><label style="flex:1">Type<select id="tk"><option value="assignment">Assignment</option><option value="form">Form</option></select></label><label style="flex:1">Marks<input id="tm" type="number" value="10" min="0"></label></div>
  <label>Fields students fill (comma separated)<input id="tfl" value="Drive link"></label><button>Publish task</button></form>
  <h2>Published</h2>${D.tasks.map(t=>`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="chip ${t.kind==='form'?'v':'y'}">${t.kind}</span></div><div class="bar" style="margin-top:8px"><i style="width:${t.done?64:38}%"></i></div><div class="mut">${t.done?'23':'14'} of 36 submitted</div></div>`).join('')}`},
 pulse(){const avg=k=>D.pulse.reduce((a,s)=>a+s[k],0)/D.pulse.length;
  return `<h1>Academic Pulse</h1><div class="card"><div class="rings">${ring(Math.round(avg('att')),'Avg attendance')}${ring(Math.round(avg('m')*2),'Avg internals','#ff7ad9')}${ring(Math.round(avg('cg')*10),'CGPA '+avg('cg').toFixed(1),'#2ee6c5')}</div></div>
  <h2>Student attention</h2>${[...D.pulse].sort((a,b)=>a.att-b.att).map(s=>`<div class="card"><div class="row"><b>${esc(s.n)}</b><span>${s.att<75?'<span class="chip r">Low attendance</span>':''}${s.m<25?'<span class="chip y">Weak internals</span>':''}${s.att>=75&&s.m>=25?'<span class="chip g">On track</span>':''}</span></div><div class="mut">Attendance ${s.att}% · Internals ${s.m}/50 · CGPA ${s.cg}</div><div class="bar" style="margin-top:6px"><i style="width:${s.att}%"></i></div></div>`).join('')}`},
 swap(){const opts=D.sched.map(s=>`<option value="${s.id}">${s.start} ${esc(s.subj)} (${esc(s.sec)})</option>`).join('');
  return `<h1>Schedule</h1><h2>Swap requests</h2>${D.req.map(r=>`<div class="card"><div class="row"><span><b>${esc(r.from)}</b> → ${esc(r.to)}</span><span class="chip ${r.status==='accepted'?'g':r.status==='rejected'?'r':'y'}">${r.status}</span></div><div class="mut">${esc(r.slot)} · ${esc(r.reason)}</div>
  ${!r.mine&&r.status==='pending'?`<div class="row" style="margin-top:10px;justify-content:flex-start"><button class="ok" data-req="${r.id}:accepted">Accept</button><button class="no" data-req="${r.id}:rejected">Reject</button></div>`:''}</div>`).join('')}
  <button class="ghost" data-act="newreq" style="margin-bottom:18px">Request a swap</button>
  <h2>Schedule Editor</h2><form class="card" id="ef"><label>Class<select id="es">${opts}</select></label><label>Change<select id="ec"><option value="Room changed">New room</option><option value="Moved">New time</option><option value="Cancelled">Cancel class</option></select></label>
  <label>New value (room or time)<input id="ev" placeholder="e.g. Lab-5 or 14:00"></label><button>Publish to affected students</button></form>`},
 alerts(){return `<h1>Activity</h1><div class="card tl" style="padding-left:30px">${D.log.map(l=>`<div style="padding:6px 0">${esc(l)}</div>`).join('')}</div>
  <h2>Notifications</h2>${D.notes.map(n=>`<div class="card">${esc(n.text)}</div>`).join('')}`}}};

/* ===== ACTIONS ===== */
const log=m=>{D.log.unshift(m)};
const SQL=`-- Create users in Supabase Auth with email <id>@campus.hub, then insert matching rows.
create table users(id uuid primary key references auth.users, login_id text unique, role text check(role in('student','faculty')), name text);
create table students(user_id uuid primary key references users, dept text, section text, attendance int, cgpa numeric, internals jsonb);
create table faculty(user_id uuid primary key references users, dept text);
create table schedule(id bigserial primary key, start_t time, end_t time, subject text, room text, faculty_id uuid references users, section text, status text default 'normal');
create table tasks(id bigserial primary key, author uuid references users, title text, kind text, marks int, due text, section text, fields jsonb);
create table broadcasts(id bigserial primary key, author uuid references users, scope text, title text, body text, created_at timestamptz default now());
create table institutional_updates(id bigserial primary key, tag text, title text, body text, created_at timestamptz default now());
create table notifications(id bigserial primary key, user_id uuid references users, text text, created_at timestamptz default now());
create table read_status(user_id uuid references users, item_type text, item_id bigint, primary key(user_id,item_type,item_id));
create table schedule_requests(id bigserial primary key, from_id uuid references users, to_id uuid references users, schedule_id bigint, reason text, status text default 'pending');

create function is_faculty() returns boolean language sql security definer as $$ select exists(select 1 from users where id=auth.uid() and role='faculty') $$;
alter table users enable row level security; alter table students enable row level security; alter table faculty enable row level security;
alter table schedule enable row level security; alter table tasks enable row level security; alter table broadcasts enable row level security;
alter table institutional_updates enable row level security; alter table notifications enable row level security;
alter table read_status enable row level security; alter table schedule_requests enable row level security;

create policy "own profile" on users for select using(id=auth.uid());
create policy "own student row" on students for select using(user_id=auth.uid() or is_faculty());
create policy "faculty row" on faculty for select using(user_id=auth.uid());
create policy "read schedule" on schedule for select to authenticated using(true);
create policy "faculty edits schedule" on schedule for all using(is_faculty()) with check(is_faculty());
create policy "read tasks" on tasks for select to authenticated using(true);
create policy "faculty posts tasks" on tasks for insert with check(is_faculty());
create policy "read broadcasts" on broadcasts for select to authenticated using(true);
create policy "faculty posts broadcasts" on broadcasts for insert with check(is_faculty());
create policy "read updates" on institutional_updates for select to authenticated using(true);
create policy "own notifications" on notifications for all using(user_id=auth.uid());
create policy "own read status" on read_status for all using(user_id=auth.uid());
create policy "my swap requests" on schedule_requests for all using(from_id=auth.uid() or to_id=auth.uid());`;

function openMsg(type,id){const m=(type==='upd'?D.upd:D.bc).find(x=>x.id==id);D.read.add(type==='upd'?'u'+id:id);
 open(`<span class="chip ${type==='upd'?'v':'y'}">${esc(type==='upd'?m.tag:m.scope)}</span><h2>${esc(m.title)}</h2><p>${esc(m.body)}</p><div class="mut">${esc(m.from||'Institution')}</div>`);}
function openTask(id){const t=D.tasks.find(x=>x.id==id);
 open(`<span class="chip y">${t.kind}</span><h2>${esc(t.title)}</h2><p class="mut">${esc(t.subj)} · ${t.marks?t.marks+' marks':'No marks'} · Due ${esc(t.due)}</p>
 ${t.done?'<div class="card"><span class="chip g">Submitted</span> Your response is with the faculty.</div>':`<form id="sf" data-id="${t.id}">${t.fields.map(field).join('')}<button>Submit</button></form>`}`);}
function openReq(){open(`<h2>Request a swap</h2><form id="rf"><label>Class to swap<select id="rs">${D.sched.map(s=>`<option>${esc(s.subj)}, ${s.start}</option>`).join('')}</select></label><label>With<select id="rt"><option>Prof. R. Kumar</option><option>Dr. S. Nair</option></select></label><label>Reason<input id="rr" required></label><button>Send request</button></form>`)}

document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let x;
 if(x=g('[data-fill]')){$('#lid').value=x.dataset.fill;$('#lpw').value='demo123'}
 else if(x=g('[data-tab]')){tab=x.dataset.tab;filt='All';render()}
 else if(x=g('[data-filt]')){filt=x.dataset.filt;$('#view').innerHTML=VIEWS[me.role][tab]()}
 else if(x=g('[data-msg]')){const[t,i]=x.dataset.msg.split(':');openMsg(t,i)}
 else if(x=g('[data-task]'))openTask(x.dataset.task);
 else if(x=g('[data-hit]')){const[k,i]=x.dataset.hit.split(':');q='';$('#sr').innerHTML='';$('#q').value='';k==='task'?openTask(i):openMsg(k,i)}
 else if(x=g('[data-req]')){const[i,s]=x.dataset.req.split(':'),r=D.req.find(r=>r.id==i);r.status=s;log(`${s==='accepted'?'Accepted':'Rejected'} swap request from ${r.from}`);toast(s==='accepted'?'Swap accepted':'Swap rejected');$('#view').innerHTML=VIEWS.faculty.swap()}
 else if(x=g('[data-act]')){const a=x.dataset.act;
  if(a==='close')closeDr();
  if(a==='out'){me=null;loginView()}
  if(a==='sql')open(`<h2>Supabase setup</h2><p class="mut">1. Run this in the SQL editor. 2. Add your URL and anon key to CONFIG at the top of the script.</p><textarea rows="12" readonly style="font:12px monospace">${esc(SQL)}</textarea><button data-act="copy">Copy SQL</button>`);
  if(a==='copy'){navigator.clipboard?.writeText(SQL);toast('SQL copied')}
  if(a==='readall'){[...D.bc.map(b=>b.id),...D.upd.map(u=>'u'+u.id)].forEach(i=>D.read.add(i));toast('All marked read');render()}
  if(a==='clear'){D.notes=[];toast('Notifications cleared');render()}
  if(a==='newreq')openReq()}
 if(e.target.closest('#vl'))closeDr();
 if(g('#dr')&&!g('[data-act=close]')&&document.querySelector('#view'))setTimeout(()=>{if(me&&me.role==='student'&&!$('#dr.show'))render()},0)});

document.addEventListener('submit',async e=>{const f=e.target;if(f.id==='lf')return;e.preventDefault();
 if(f.id==='sf'){D.tasks.find(t=>t.id==f.dataset.id).done=true;closeDr();toast('Submitted. Nice work!');render()}
 if(f.id==='bf'){const b={id:Date.now(),from:me.name,scope:$('#bs').value,title:$('#bt').value,body:$('#bm').value,time:'Just now'};D.bc.unshift(b);await save('broadcasts',b);log(`Broadcast "${b.title}" to ${b.scope}`);toast('Broadcast sent to '+b.scope);$('#view').innerHTML=VIEWS.faculty.bcast()}
 if(f.id==='tf'){const t={id:Date.now(),title:$('#tt').value,subj:'DBMS',due:'Next week',marks:+$('#tm').value,kind:$('#tk').value,fields:$('#tfl').value.split(',').map(s=>s.trim()).filter(Boolean),done:false};D.tasks.unshift(t);await save('tasks',t);D.notes.unshift({id:t.id,text:`New ${t.kind}: ${t.title}`,time:'now'});log(`Published ${t.kind} "${t.title}"`);toast('Task published');$('#view').innerHTML=VIEWS.faculty.tasks()}
 if(f.id==='ef'){const s=D.sched.find(x=>x.id==$('#es').value),c=$('#ec').value,v=$('#ev').value;s.status=c;if(c==='Room changed'&&v)s.room=v;if(c==='Moved'&&v){s.end=v.slice(0,2)*1+1+v.slice(2);s.start=v}
  D.notes.unshift({id:Date.now(),text:`${s.subj}: ${c.toLowerCase()}${v?' → '+v:''}`,time:'now'});log(`Schedule change: ${s.subj} (${c})`);toast(`Published to ${s.sec} students`)}
 if(f.id==='rf'){D.req.unshift({id:Date.now(),from:me.name,to:$('#rt').value,slot:$('#rs').value,reason:$('#rr').value,status:'pending',mine:true});log('Requested a swap with '+$('#rt').value);closeDr();toast('Request sent');$('#view').innerHTML=VIEWS.faculty.swap()}});

loginView();
</script></body></html>
